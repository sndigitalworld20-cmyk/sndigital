<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <table border="1" align="center" id="niranjan" >
        <thead>
            <th>user id.</th>
            <th>id</th>
            <th>title</th>
            <th>body</th>       
        </thead>
        <tbody>
           
        </tbody>
    </table>
    <script>
        async function getData() {
            const response = await fetch('https://jsonplaceholder.typicode.com/posts');

            let data = await response.json();

            console.log(data);

            data.forEach(element => {
               
                let s = `
                <tr>
                <td>${element.userid}</td>
                <td>${element.id}</td>
                <td>${element.title}</td>
                <td>${element.body}</td>
                </tr>
                `;

                // let s = `
                // <tr>
                //     <td>`+ element.id +`</td><td></td><td></td>
                //     </tr>
                // `;

                document.querySelector("#niranjan tbody").innerHTML +=s;
            });
        }

        getData();
    </script>
</body>

</html>
