<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="stoptimer()">stop timer</button>
    <script>
        let count = 1;
        function every2(){
            console.log(count++);
        }
const mTimer=setInterval(every2,2000);

        function stoptimer(){
            clearInterval(mTimer);
        }
    </script>
</body>
</html>
